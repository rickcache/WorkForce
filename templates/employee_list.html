<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
   <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #CFD3E9;
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1.heading-cover {
        background: #E6DC51; 
        padding: 8px 16px;                     
        border-radius: 8px;                     
        box-shadow: 0 2px 5px rgba(0,0,0,0.15); 
        margin: 0 0 20px 0;  
        text-align: center;
        font-size: 28px;
    }

    .total {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        font-size: 18px;
    }

    .section-box {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        padding: 30px;
        width: 95%;
        max-width: 1200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 30px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        border-radius: 12px;
        overflow: hidden;
    }

    th, td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }

    th {
        background-color: #E6DC51;
        font-weight: bold;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    tr:hover {
        background-color: #f1f1f1;
    }

    @media (max-width: 768px) {
        .section-box {
            padding: 20px;
        }

        th, td {
            padding: 8px;
            font-size: 14px;
        }

        h1.heading-cover {
            font-size: 24px;
        }
    }
</style>

    </style>
</head>
<body>

    <h1 class="heading-cover">Employee List</h1> <br>
    <div>
    <div class="total">Total Employees: {{ total_employees }}</div>
    </div>

    <div class="section-box">
    <table>
        <thead >
            <tr style=" background-color: #E6DC51;">
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody>
            {% for emp in employees %}
            <tr>
                <td>{{ emp.get('id', '-') }}</td>
                <td>{{ emp.get('name', '-') }}</td>
                <td>{{ emp.get('email', '-') }}</td>
                <td>{{ emp.get('phone', '-') }}</td>
                <td>{{ emp.get('address', '-') }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    </div>

</body>
</html>
